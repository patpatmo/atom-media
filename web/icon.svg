<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Atom Media logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2530"/>
      <stop offset="0.45" stop-color="#071019"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#e0faff"/>
      <stop offset="0.35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色圆角底板 -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>

  <!-- 原子核外圈光晕 -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="4"/>

  <!-- 原子核 -->
  <circle cx="256" cy="256" r="46" fill="url(#nucleus)" filter="url(#glow)"/>

  <!-- 三条电子轨道与电子 -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#22d3ee" stroke-width="13" transform="rotate(0 256 256)">
      <ellipse cx="256" cy="256" rx="172" ry="66"/>
      <circle cx="428" cy="256" r="19" fill="#cffafe" stroke="#22d3ee" stroke-width="4"/>
    </g>
    <g stroke="#06b6d4" stroke-width="11" stroke-opacity="0.9" transform="rotate(60 256 256)">
      <ellipse cx="256" cy="256" rx="172" ry="66"/>
      <circle cx="256" cy="190" r="16" fill="#a5f3fc" stroke="#06b6d4" stroke-width="4"/>
    </g>
    <g stroke="#0891b2" stroke-width="10" stroke-opacity="0.75" transform="rotate(120 256 256)">
      <ellipse cx="256" cy="256" rx="172" ry="66"/>
      <circle cx="84" cy="256" r="14" fill="#67e8f9" stroke="#0891b2" stroke-width="4"/>
    </g>
  </g>
</svg>
